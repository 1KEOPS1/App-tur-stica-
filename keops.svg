    <text x="256" y="294" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="67" font-weight="900" letter-spacing="-3" textLength="303" lengthAdjust="spacingAndGlyphs" fill="#fff" stroke="#000" stroke-width="3" paint-order="stroke">KEOPS</text>

