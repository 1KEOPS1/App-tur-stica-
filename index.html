<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Descubrí Esquel: lugares, naturaleza, pesca con mosca, excursiones, gastronomía y experiencias en la Patagonia."
  >

  <meta
    name="theme-color"
    content="#0b3028"
  >

  <title>
    Descubrí Esquel | Patagonia
  </title>


  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f7f5ef;

      color: #17352e;

      line-height: 1.6;
    }

    a {
      text-decoration: none;
    }


    /* =====================================================
       COLORES
    ===================================================== */

    :root {

      --verde: #0b3028;

      --verde-claro: #1c594a;

      --verde-suave: #dce8e2;

      --arena: #e8ddc4;

      --crema: #f5f0e5;

      --blanco: #ffffff;

      --texto: #17352e;

      --gris: #66736e;

      --borde: #e4e8e5;

      --sombra:
        0 12px 35px
        rgba(0,0,0,0.09);

      --radio: 22px;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    header {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;

      z-index: 1000;

      padding: 18px 6%;

      display: flex;

      align-items: center;

      justify-content: space-between;

      color: white;

      background:
        rgba(7, 29, 25, 0.84);

      backdrop-filter:
        blur(10px);
    }

    .logo {

      color: white;

      font-size: 1.15rem;

      font-weight: 800;

      letter-spacing: 1px;
    }

    .logo span {

      color:
        var(--arena);
    }

    nav {

      display: flex;

      gap: 25px;

      align-items: center;
    }

    nav a {

      color: white;

      font-size: 0.92rem;

      font-weight: 600;

      transition:
        0.25s;
    }

    nav a:hover {

      color:
        var(--arena);
    }

    .nav-button {

      background:
        var(--arena);

      color:
        var(--verde) !important;

      padding:
        10px 17px;

      border-radius:
        999px;
    }


    /* =====================================================
       HERO
    ===================================================== */

    .hero {

      min-height:
        100vh;

      padding:
        150px 7% 90px;

      display:
        flex;

      align-items:
        center;

      position:
        relative;

      overflow:
        hidden;

      color:
        white;

      background:

        linear-gradient(
          rgba(6,31,27,0.38),
          rgba(6,31,27,0.86)
        ),

        radial-gradient(
          circle at 75% 25%,
          #557c70 0%,
          #285448 38%,
          #0b3028 78%
        );
    }

    .hero::after {

      content: "";

      position:
        absolute;

      width:
        850px;

      height:
        300px;

      right:
        -180px;

      bottom:
        -90px;

      border-radius:
        50%;

      background:
        rgba(255,255,255,0.05);

      transform:
        rotate(-7deg);
    }

    .hero-content {

      max-width:
        800px;

      position:
        relative;

      z-index:
        2;
    }

    .eyebrow {

      color:
        var(--arena);

      text-transform:
        uppercase;

      letter-spacing:
        4px;

      font-size:
        0.78rem;

      font-weight:
        800;

      margin-bottom:
        18px;
    }

    .hero h1 {

      font-size:
        clamp(
          3.4rem,
          8vw,
          7rem
        );

      line-height:
        0.9;

      letter-spacing:
        -4px;

      margin-bottom:
        28px;
    }

    .hero h1 span {

      color:
        var(--arena);
    }

    .hero-description {

      max-width:
        650px;

      color:
        #edf3f0;

      font-size:
        1.2rem;

      margin-bottom:
        32px;
    }

    .hero-buttons {

      display:
        flex;

      flex-wrap:
        wrap;

      gap:
        14px;
    }

    .button {

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      padding:
        14px 22px;

      border-radius:
        999px;

      font-weight:
        800;

      transition:
        0.25s;
    }

    .button:hover {

      transform:
        translateY(-3px);
    }

    .button-primary {

      background:
        var(--arena);

      color:
        var(--verde);
    }

    .button-secondary {

      color:
        white;

      border:
        1px solid
        rgba(255,255,255,0.5);
    }


    /* =====================================================
       SECCIONES
    ===================================================== */

    section {

      padding:
        90px 7%;
    }

    .section-header {

      max-width:
        760px;

      margin:
        0 auto 50px;

      text-align:
        center;
    }

    .small-title {

      color:
        var(--verde-claro);

      text-transform:
        uppercase;

      letter-spacing:
        3px;

      font-size:
        0.75rem;

      font-weight:
        800;

      margin-bottom:
        10px;
    }

    .section-header h2 {

      color:
        var(--verde);

      font-size:
        clamp(
          2.2rem,
          5vw,
          3.8rem
        );

      line-height:
        1.05;

      margin-bottom:
        15px;
    }

    .section-header p {

      color:
        var(--gris);

      font-size:
        1.05rem;
    }


    /* =====================================================
       DESTINOS / LUGARES
    ===================================================== */

    .lugares {

      background:
        var(--crema);
    }

    .lugares-grid {

      max-width:
        1200px;

      margin:
        auto;

      display:
        grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap:
        22px;
    }

    .lugar {

      min-height:
        360px;

      padding:
        28px;

      border-radius:
        var(--radio);

      position:
        relative;

      overflow:
        hidden;

      display:
        flex;

      align-items:
        flex-end;

      color:
        white;

      box-shadow:
        var(--sombra);

      transition:
        0.3s;
    }

    .lugar:hover {

      transform:
        translateY(-7px);
    }

    .lugar::before {

      content:
        "";

      position:
        absolute;

      inset:
        0;

      background:
        linear-gradient(
          transparent 25%,
          rgba(0,0,0,0.82)
        );
    }

    .lugar-content {

      position:
        relative;

      z-index:
        2;
    }

    .lugar-icon {

      font-size:
        2.5rem;

      margin-bottom:
        8px;
    }

    .lugar h3 {

      font-size:
        1.9rem;

      margin-bottom:
        6px;
    }

    .lugar p {

      color:
        #edf3f0;

      font-size:
        0.95rem;
    }

    .lugar-link {

      display:
        inline-block;

      margin-top:
        14px;

      color:
        var(--arena);

      font-weight:
        800;

      font-size:
        0.9rem;
    }


    /* Fondos provisionales */

    .trochita {

      background:
        linear-gradient(
          145deg,
          #586d68,
          #183a34
        );
    }

    .alerces {

      background:
        linear-gradient(
          145deg,
          #66826b,
          #1b4030
        );
    }

    .lahoya {

      background:
        linear-gradient(
          145deg,
          #8095a0,
          #263f4b
        );
    }

    .lagunazeta {

      background:
        linear-gradient(
          145deg,
          #5d8980,
          #183f39
        );
    }

    .piedraparada {

      background:
        linear-gradient(
          145deg,
          #92775e,
          #44372c
        );
    }

    .torrecillas {

      background:
        linear-gradient(
          145deg,
          #78949b,
          #263f45
        );
    }


    /* =====================================================
       EXPERIENCIAS
    ===================================================== */

    .experiencias {

      background:
        white;
    }

    .experiencias-grid {

      max-width:
        1150px;

      margin:
        auto;

      display:
        grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap:
        18px;
    }

    .experiencia {

      padding:
        30px 20px;

      text-align:
        center;

      border:
        1px solid
        var(--borde);

      border-radius:
        20px;

      transition:
        0.25s;
    }

    .experiencia:hover {

      transform:
        translateY(-5px);

      box-shadow:
        var(--sombra);
    }

    .experiencia-icon {

      font-size:
        2.7rem;

      margin-bottom:
        13px;
    }

    .experiencia h3 {

      color:
        var(--verde);

      margin-bottom:
        8px;
    }

    .experiencia p {

      color:
        var(--gris);

      font-size:
        0.93rem;
    }


    /* =====================================================
       PESCA
    ===================================================== */

    .pesca {

      color:
        white;

      background:
        linear-gradient(
          135deg,
          #092a24,
          #1d5548
        );
    }

    .pesca-container {

      max-width:
        1100px;

      margin:
        auto;

      display:
        grid;

      grid-template-columns:
        1fr 1fr;

      gap:
        60px;

      align-items:
        center;
    }

    .pesca .small-title {

      color:
        var(--arena);
    }

    .pesca h2 {

      color:
        white;

      font-size:
        clamp(
          2.6rem,
          5vw,
          4.5rem
        );

      line-height:
        1;

      margin:
        15px 0 20px;
    }

    .pesca-text > p {

      color:
        #dce8e3;

      margin-bottom:
        25px;
    }

    .pesca-list {

      display:
        grid;

      gap:
        10px;
    }

    .pesca-item {

      padding:
        13px 16px;

      border-radius:
        12px;

      background:
        rgba(255,255,255,0.08);
    }

    .pesca-visual {

      min-height:
        380px;

      border-radius:
        25px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      text-align:
        center;

      padding:
        30px;

      background:
        radial-gradient(
          circle at 50% 30%,
          #73978c,
          #1d5548 45%,
          #092a24 80%
        );
    }

    .pesca-visual strong {

      display:
        block;

      font-size:
        6rem;
    }

    .pesca-visual p {

      color:
        #edf5f1;

      margin-top:
        15px;
    }


    /* =====================================================
       INFO
    ===================================================== */

    .info {

      background:
        var(--crema);
    }

    .info-grid {

      max-width:
        1100px;

      margin:
        auto;

      display:
        grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap:
        20px;
    }

    .info-card {

      padding:
        28px;

      background:
        white;

      border-radius:
        20px;

      box-shadow:
        0 8px 25px
        rgba(0,0,0,0.05);
    }

    .info-icon {

      font-size:
        2rem;

      margin-bottom:
        10px;
    }
